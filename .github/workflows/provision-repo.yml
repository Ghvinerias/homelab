name: Provision Repository

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository to provision (owner/repo)"
        required: true
        type: string

jobs:
  provision:
    name: "Provision ${{ inputs.target_repo }}"
    runs-on: ubuntu-latest

    # Permissions for this workflow's built-in GITHUB_TOKEN.
    # The GitHub App token below has its own permissions.
    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------
      # Checkout the repository containing the provisioning scripts
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Validate configuration and target repository
      # ------------------------------------------------------------
      - name: Preflight — verify configuration
        id: preflight
        shell: bash
        env:
          BW_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_PROVISIONER_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_PROVISIONER_APP_PRIVATE_KEY }}

          TARGET_REPO: ${{ inputs.target_repo }}
          EXPECTED_OWNER: ${{ vars.GH_PROVISIONER_ORG }}

        run: |
          set -euo pipefail

          missing=()

          [[ -z "$BW_ACCESS_TOKEN" ]] && \
            missing+=("BW_ACCESS_TOKEN")

          [[ -z "$GH_APP_CLIENT_ID" ]] && \
            missing+=("GH_PROVISIONER_APP_CLIENT_ID")

          [[ -z "$GH_APP_PRIVATE_KEY" ]] && \
            missing+=("GH_PROVISIONER_APP_PRIVATE_KEY")

          [[ -z "$EXPECTED_OWNER" ]] && \
            missing+=("GH_PROVISIONER_ORG")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::The following configuration values are missing: ${missing[*]}"
            exit 1
          fi

          # Require exactly owner/repository format.
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::target_repo must be in owner/repo format."
            exit 1
          fi

          TARGET_OWNER="${TARGET_REPO%%/*}"
          TARGET_NAME="${TARGET_REPO#*/}"

          if [[ "$TARGET_OWNER" != "$EXPECTED_OWNER" ]]; then
            echo "::error::Target repository must belong to organization '$EXPECTED_OWNER'."
            exit 1
          fi

          # Make these available to later steps.
          echo "target_owner=$TARGET_OWNER" >> "$GITHUB_OUTPUT"
          echo "target_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"

          echo "Preflight passed."
          echo "Target owner: $TARGET_OWNER"
          echo "Target repository: $TARGET_NAME"

      # ------------------------------------------------------------
      # Generate short-lived GitHub App installation token
      #
      # This token is:
      #   - for the slick-ge GitHub App installation
      #   - restricted to the requested repository
      #   - restricted to repository Secrets permission
      # ------------------------------------------------------------
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_PROVISIONER_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_PROVISIONER_APP_PRIVATE_KEY }}

          owner: ${{ steps.preflight.outputs.target_owner }}

          repositories: |
            ${{ steps.preflight.outputs.target_name }}

          permission-secrets: write

      # ------------------------------------------------------------
      # Python environment
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: custom-tooling/bws_secret_injector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r custom-tooling/bws_secret_injector/requirements.txt

      # ------------------------------------------------------------
      # Inject BW_ACCESS_TOKEN into target repository
      #
      # GH_PAT is retained as the variable name so your existing
      # inject_secret.py does not need to change yet.
      #
      # Despite the name, this is NOT a PAT anymore.
      # It is a short-lived GitHub App installation token.
      # ------------------------------------------------------------
      - name: Copy BW_ACCESS_TOKEN to target repo
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}

          TARGET_REPO: ${{ inputs.target_repo }}

          SECRET_NAME: "BW_ACCESS_TOKEN"
          SECRET_VALUE: ${{ secrets.BW_ACCESS_TOKEN }}

        run: |
          python custom-tooling/bws_secret_injector/inject_secret.py

      # ------------------------------------------------------------
      # Workflow summary
      # ------------------------------------------------------------
      - name: Summary
        if: success()
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          {
            echo "### Provisioning complete :white_check_mark:"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Target repo | \`$TARGET_REPO\` |"
            echo "| Secret copied | \`BW_ACCESS_TOKEN\` |"
            echo "| Authentication | GitHub App |"
            echo "| GitHub App repository scope | \`${{ steps.preflight.outputs.target_name }}\` |"
            echo "| GitHub App permission | \`Secrets: write\` |"
          } >> "$GITHUB_STEP_SUMMARY"
